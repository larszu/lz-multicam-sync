[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lzsync"
version = "0.1.2"
description = "Multicam-/Audio-Sync-Engine für die Postproduktion (FCPXML rein, FCPXML raus)"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scipy>=1.11"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
lzsync = "lzsync.cli:main"

[project.gui-scripts]
lzsync-gui = "lzsync.gui:main"

[tool.setuptools]
packages = ["lzsync"]

[tool.pytest.ini_options]
testpaths = ["tests"]
