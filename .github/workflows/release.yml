name: release

# Windows EXE and macOS DMG; on a v-tag they are attached to a GitHub release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -e '.[dev]' && pytest -q

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e '.[gui]' pyinstaller
      - name: ffmpeg next to the exe
        shell: pwsh
        run: |
          Invoke-WebRequest https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip -OutFile ff.zip
          Expand-Archive ff.zip -DestinationPath ff
          $bin = (Get-ChildItem ff -Recurse -Filter ffmpeg.exe | Select-Object -First 1).DirectoryName
          Copy-Item "$bin\ffmpeg.exe","$bin\ffprobe.exe" .
      - name: build
        shell: pwsh
        run: |
          $v = python -c "import lzsync; print(lzsync.__version__)"
          pyinstaller --noconfirm --onefile --windowed --name "LZ-Multicam-Sync-$v" `
            --add-binary "ffmpeg.exe;." --add-binary "ffprobe.exe;." `
            --add-data "lzsync/ui;lzsync/ui" --collect-submodules lzsync --collect-submodules webview `
            packaging/entry.py
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: dist/*.exe }

  macos:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e '.[gui]' pyinstaller
      - run: PY=python sh packaging/build_mac.sh
      - uses: actions/upload-artifact@v4
        with: { name: macos, path: dist/*.dmg }

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            windows/*.exe
            macos/*.dmg
